name: imindbench
channels:
  - conda-forge
  - nodefaults

# Install torch_brain-public separately, without its dev extra:
#   python -m pip install -e /path/to/torch_brain-public
dependencies:
  - python=3.10
  - pip
  - setuptools>=80
  - numpy>=1.26,<3
  - scipy>=1.11,<2
  - pandas>=1.5,<3
  - scikit-learn>=1.6,<2
  - threadpoolctl>=3.2,<4
  - h5py>=3,<4
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - einops>=0.8,<0.9
  - jaxtyping>=0.3,<0.4
  - mne>=1.10,<1.12
  - psutil>=5.9,<8
  - pytest>=7.2,<9
  - pip:
      - torch==2.9.1
      - xformers==0.0.33.post2
      - mup==1.0.0
      - warmup-scheduler@git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git@7021d63a49106e22c79b40564a7d39930e7b0f53

# Optional: install wandb only when remote experiment logging is enabled.
