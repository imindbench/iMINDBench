name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install reviewed runtime
        run: |
          python -m pip install "torch_brain @ git+https://github.com/neuro-galaxy/torch_brain.git@e39f48ce0ec8c8f59be2507dca8ae172cce79d28"
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Validate source export and packaging
        run: |
          python scripts/build_submission.py --output /tmp/imindbench-submission.tar.gz
          mkdir /tmp/submission
          tar -xzf /tmp/imindbench-submission.tar.gz -C /tmp/submission
          cd /tmp/submission/imindbench
          python -m build
