[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "imindbench"
version = "0.1.0.dev0"
description = "Reproducible evaluation workflows for public intracranial neural decoding benchmarks"
readme = "neuroprobe_eval/README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "THIRD_PARTY.md", "LICENSES/BaRISTA-LICENSE.md"]
dependencies = [
    "einops>=0.8,<0.9",
    "hydra-core==1.3.2",
    "jaxtyping>=0.3,<0.4",
    "mne>=1.10,<1.12",
    "mup==1.0.0",
    "numpy>=1.26,<3",
    "omegaconf==2.3.0",
    "psutil>=5.9,<8",
    "scikit-learn>=1.6,<2",
    "scipy>=1.11,<2",
    "threadpoolctl>=3.2,<4",
    "torch==2.9.1",
    "xformers==0.0.33.post2",
    "pytorch-gradual-warmup-lr @ git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git@7021d63a49106e22c79b40564a7d39930e7b0f53",
]

[project.optional-dependencies]
logging = ["wandb>=0.21,<0.25"]

[project.scripts]
neuroprobe-eval = "neuroprobe_eval.run_eval:main"

[tool.setuptools.packages.find]
include = ["neuroprobe_eval*"]

[tool.setuptools.package-data]
neuroprobe_eval = [
    "conf/**/*.yaml",
    "decodable_subject_sessions/**/*.json",
    "decodable_subject_sessions/**/README.md",
]
