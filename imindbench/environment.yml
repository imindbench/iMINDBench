name: imindbench
channels:
  - conda-forge
  - defaults

# Minimal runtime environment for:
#   imindbench/run_eval.py
# against local brainsets + torch_brain source trees in this workspace.

dependencies:
  - python=3.10
  - pip
  - setuptools>=80
  - setuptools-scm>=8
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - threadpoolctl
  - h5py
  - psutil
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - packaging
  - pydantic>=2
  - einops
  - jaxtyping
  - mne
  - typeguard
  - tqdm
  - pyyaml
  - tensorboard
  - pip:
      - torch==2.9.1
      - temporaldata>=0.1.3
      - torchtyping==0.1.5
      # BaRISTA only. models/barista_components/transformer.py imports
      # xformers.ops at module scope, so the wheel must match the torch build
      # above -- an xformers built against a different torch fails to import,
      # which the model registry now degrades to skipping BaRISTA rather than
      # breaking every model. Pin this to the version matching your torch.
      - xformers
      - mup
      - warmup_scheduler@git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git@7021d63a49106e22c79b40564a7d39930e7b0f53
      - -e /path/to/brainsets
      - -e /path/to/torch_brain

# Optional extras:
# - wandb        if you want default config logging instead of the current warning-only fallback
