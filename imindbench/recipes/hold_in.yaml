description: Decodable PopT hold-in-session targets.
target_set: scaling
overrides:
  dataset.label_mode: binary
  dataset.train_same_subject_only: false
  dataset.train_sample_fraction: 1.0
  dataset.max_train_samples_per_subject: auto
  dataset.train_decodable_subject_sessions_only: true
datasets:
  neuroprobev2:
    dataset: neuroprobev2
    output_group: neuroprobev2_stft_or_htnet_500hz_val_mean0p60
    preprocessor: laplacian_multi_stft_2048Hz
    models:
      popt: {}
    regimes:
    - hold-in-session
    overrides:
      dataset.subset_tier: lite
    output_subset: true
  kelesbyd2024:
    dataset: kelesbyd2024
    output_group: kelesbyd2024_tercile_stft_or_htnet_500hz_val_mean0p60
    preprocessor: laplacian_multi_stft_1000Hz
    models:
      popt: {}
    regimes:
    - hold-in-session
  berezutskayapippi2022:
    dataset: berezutskayapippi2022
    output_group: berezutskayapippi2022_tercile_stft_or_htnet_500hz_val_mean0p60
    preprocessor: laplacian_multi_stft_2048Hz
    models:
      popt: {}
    regimes:
    - hold-in-session
    overrides:
      dataset.subset_tier: high-cov
    output_subset: true
decodable_rule: stft_or_htnet_500hz_val_mean0p60
