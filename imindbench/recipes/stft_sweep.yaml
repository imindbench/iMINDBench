description: Single-STFT window, overlap and frequency sweep.
target_set: all
overrides:
  dataset.label_mode: binary
  dataset.train_same_subject_only: false
  dataset.train_sample_fraction: 1.0
datasets:
  neuroprobev2:
    dataset: neuroprobev2
    output_group: neuroprobev2_stft_sweep_with_val
    preprocessor: laplacian_stft_2048Hz
    models:
      logistic: {}
    regimes:
    - within-session
    sweep:
      preprocessor.chain.2.nperseg:
        label: nperseg
        values:
        - '256'
        - '512'
        - '1024'
      preprocessor.chain.2.poverlap:
        label: poverlap
        values:
        - '0.50'
        - '0.75'
        - '0.875'
      preprocessor.chain.2.max_frequency:
        label: fmax
        values:
        - '100'
        - '150'
        - '250'
        - '400'
  kelesbyd2024:
    dataset: kelesbyd2024
    output_group: kelesbyd2024_stft_sweep_with_nonword_tercile
    preprocessor: laplacian_stft_1000Hz
    models:
      logistic: {}
    regimes:
    - within-session
    sweep:
      preprocessor.chain.2.nperseg:
        label: nperseg
        values:
        - '125'
        - '250'
        - '500'
      preprocessor.chain.2.poverlap:
        label: poverlap
        values:
        - '0.50'
        - '0.75'
        - '0.875'
      preprocessor.chain.2.max_frequency:
        label: fmax
        values:
        - '100'
        - '150'
        - '250'
        - '400'
  berezutskayapippi2022:
    dataset: berezutskayapippi2022
    output_group: berezutskayapippi2022_stft_sweep_with_nonword_tercile
    preprocessor: laplacian_stft_2048Hz
    models:
      logistic: {}
    regimes:
    - within-session
    overrides:
      dataset.subset_tier: high-cov
    output_subset: true
    sweep:
      preprocessor.chain.2.nperseg:
        label: nperseg
        values:
        - '256'
        - '512'
        - '1024'
      preprocessor.chain.2.poverlap:
        label: poverlap
        values:
        - '0.50'
        - '0.75'
        - '0.875'
      preprocessor.chain.2.max_frequency:
        label: fmax
        values:
        - '100'
        - '150'
        - '250'
        - '400'
