description: Small checkpoint-backed BaRISTA grid with recorded training settings.
target_set: barista
overrides:
  dataset.label_mode: binary
  dataset.train_same_subject_only: false
  dataset.train_sample_fraction: 1.0
  model.max_iter: 100
  model.patience: 15
  runner.num_workers: 4
  runner.pin_memory: true
  runner.persistent_workers: true
  ++model.scheduler.warmup_steps: 500
  ++model.scheduler.step_size_updates: 95
  model.upstream_lr: '1e-3'
  model.head_lr: '1e-3'
datasets:
  neuroprobev2:
    dataset: neuroprobev2
    output_group: neuroprobev2_barista
    preprocessor: laplacian_wav_session_HPF_global_robust_scalar_2048Hz_zscore
    models:
      barista: {}
    regimes:
    - within-session
    overrides:
      dataset.brain_area_key: localization_Destrieux
  kelesbyd2024:
    dataset: kelesbyd2024
    output_group: kelesbyd2024_barista
    preprocessor: laplacian_wav_session_HPF_global_robust_scalar_1000Hz_2048Hz_zscore
    models:
      barista: {}
    regimes:
    - within-session
    overrides:
      dataset.brain_area_key: label_destrieux
      model.tokenizer.samp_frequency: 2048
  berezutskayapippi2022:
    dataset: berezutskayapippi2022
    output_group: berezutskayapippi2022_barista
    preprocessor: laplacian_wav_session_HPF_global_robust_scalar_2048Hz_zscore
    models:
      barista: {}
    regimes:
    - within-session
    overrides:
      dataset.subset_tier: high-cov
      dataset.brain_area_key: label_destrieux
tasks:
- onset
- word_index
- volume
