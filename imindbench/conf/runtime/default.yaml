# Runtime controls for evaluation execution.
seed: 42
deterministic: true  # Request deterministic Torch kernels for every input type.
overwrite: false
verbose: true
preprocess_torch_num_threads: 4
sklearn_num_threads: 4
train_source_cache_enabled: true
train_source_cache_dir: ${paths.train_source_cache_dir}
preprocessed_split_cache_enabled: false
preprocessed_split_cache_dir: ${paths.preprocessed_split_cache_dir}
preprocessed_split_cache_mode: read_write
