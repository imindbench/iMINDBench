# Channel-concat CNN model (PyTorch)
name: cnn_channel_concat
requires_aligned_channels: true

# FC head dimensions after concatenating channel embeddings
hidden_dims: []

# Shared per-channel CNN trunk
conv_channels: [16, 32]
kernel_size: 3
pool_kernel: 2
# Number of channels processed per forward call through the shared trunk.
# 0 uses all channels at once.
channel_batch_size: 0
dropout: 0.3

batch_size: 200  # Lower this on smaller GPUs if you hit OOM.
learning_rate: 0.0001
max_iter: 100
patience: 10
tol: 1e-4
random_state: 42
device: auto
requires_coords: false  # Optional; set true only for models that require channel coordinates
