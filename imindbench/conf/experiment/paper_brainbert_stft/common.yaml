# @package _global_
dataset:
  label_mode: binary
  coordinate_profile: popt_lip
  train_same_subject_only: false
  train_sample_fraction: 1.0
  max_train_samples_per_subject: auto
  train_decodable_subject_sessions_only: false
  uniquify_channel_ids_with_subject: true
  uniquify_channel_ids_with_session: true
  merge_val_into_test: false
runner:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  coord_index_policy: legacy_truncation
runtime:
  seed: 42
  preprocess_torch_num_threads: 4
