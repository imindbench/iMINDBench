# Example paths config. Copy outside the installation to <config-dir>/paths/local.yaml
# and select it with --config-dir <config-dir> paths=local.
# Use absolute paths for data, checkpoints and caches.
#
# Replace dataset_root before running; optional resources can remain null.
# Every key below must be present even when unused: conf/runtime/default.yaml
# interpolates preprocessed_split_cache_dir, and a missing key raises
# InterpolationKeyError before the run starts.

# Root holding the processed brainsets, and the directory name under it.
dataset_root: /path/to/brainsets/processed
dataset_dirname: neuroprobe_2025

# Pretrained checkpoints. Set only those your model needs to absolute paths.
barista_checkpoint: null
brainbert_checkpoint: null
popt_checkpoint: null

# Caches. When enabled, a null train_source_cache_dir uses
# <dataset_root>/.neuroprobe_eval_train_source_cache. Set an absolute path to
# place it elsewhere. preprocessed_split_cache_dir is optional, but keep the key.
train_source_cache_dir: null
preprocessed_split_cache_dir: null

# Optional inputs, null unless you are using the feature that reads them.
clean_laplacian_path: null
electrode_dir_btb: null
electrode_dir_byd: null
decodable_subject_sessions_dir: null
