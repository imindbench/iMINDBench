# 1000 Hz Laplacian STFT chain.
name: laplacian_stft
chain:
  - name: time_domain_filter
    sampling_rate: 1000
    high_gamma: false
    notch_q: 30

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: stft
    pad_mode: reflect
    padded: false
    nperseg: 250
    poverlap: 0.752  # int(250 * 0.752)=188 -> hop=62, matching 17 bins on 1 s windows
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 1000
    normalizing: none

  - name: standardize
    mode: per_channel_samples_time_pooled
