# BaRISTA waveform preprocessing for 1000 Hz BYD recordings, resampled to 2048 Hz.
chain:
  - name: time_domain_filter
    sampling_rate: 1000
    high_gamma: false
    session_wise: true
    notch_q: 30
    notch_zero_phase: true
    high_pass_hz: 0.5
    high_pass_order: 4
    high_pass_zero_phase: true
  - name: resample
    source_rate: 1000
    target_rate: 2048
  - name: laplacian_rereference
    remove_non_laplacian: true
  - name: standardize
    mode: global_robust_scalar
  - name: standardize
    mode: sample_per_channel_time
