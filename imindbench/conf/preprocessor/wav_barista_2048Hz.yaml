# BaRISTA waveform preprocessing: filter each recording's windows together, then apply
# robust global scaling and per-window channel/time z-scoring.
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    # Hz: omission uses 60 Hz harmonics through 360; [] disables notches.
    # Applied in order; frequencies at or above Nyquist are skipped.
    notch_freqs: [60, 120, 180, 240, 300, 360]
    high_gamma: false
    session_wise: true
    notch_q: 30
    notch_zero_phase: true
    # Hz: 0.0 or omission disables high-pass; null is invalid.
    high_pass_hz: 0.5
    high_pass_order: 4
    high_pass_zero_phase: true
  - name: laplacian_rereference
    remove_non_laplacian: true
  - name: standardize
    mode: global_robust_scalar
  - name: standardize
    mode: sample_per_channel_time
