# 2048 Hz Laplacian with 15 s filtering context, HPF, 500 Hz output, and sample normalization.
name: laplacian_wav_long_context_15s
chain:
  - name: context_window
    context_window_sec: 15.0
    sampling_rate: 2048

  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30
    high_pass_hz: 0.5
    high_pass_order: 4
    high_pass_zero_phase: true

  - name: crop_to_target_window

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: resample
    source_rate: 2048
    target_rate: 500

  - name: standardize
    mode: sample_per_channel_time
