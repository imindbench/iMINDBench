# 2048 Hz Laplacian with Notch Filter + sample-local per-channel time standardization.
name: laplacian_wav_sample_per_channel_time
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: standardize
    mode: sample_per_channel_time
