chain:
  - name: context_window
    context_window_sec: 15.0
    sampling_rate: 1000

  - name: time_domain_filter_diver_style
    sampling_rate: 1000
    # Hz: omitted or null (Python None) means 0.5; 0.0 disables high-pass.
    high_pass_hz: 0.5
    # Hz: omission uses [60, 120, 180].
    notch_freqs: [60, 120, 180]

  - name: crop_to_target_window

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: resample
    source_rate: 1000
    target_rate: 500
