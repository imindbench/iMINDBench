# Single-STFT input for the paper classifiers; no BrainBERT encoder.
name: laplacian_stft
chain:
- name: time_domain_filter
  sampling_rate: 1000
  high_gamma: false
  notch_q: 30
- name: laplacian_rereference
  remove_non_laplacian: true
- name: stft
  pad_mode: reflect
  padded: false
  nperseg: 250
  poverlap: 0.75
  window: hann
  max_frequency: 150
  min_frequency: 0
  sampling_rate: 1000
  normalizing: none
  freq_channel_cutoff: 40
- name: standardize
  mode: per_channel_samples_time_pooled
