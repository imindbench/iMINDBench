# 2048 Hz Laplacian STFT chain.
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: stft
    pad_mode: reflect
    padded: false
    nperseg: 512
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 2048
    normalizing: none

  - name: standardize
    mode: per_channel_samples_time_pooled
