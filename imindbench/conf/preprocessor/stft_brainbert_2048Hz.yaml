# 2048 Hz Laplacian STFT BrainBERT chain.
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: stft
    pad_mode: reflect
    padded: false
    nperseg: 512
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 2048
    normalizing: none
    freq_channel_cutoff: 40

  - name: standardize
    mode: per_channel_samples_time_pooled

  - name: brainbert_encoder
    upstream_ckpt: ${paths.brainbert_checkpoint}
    device: ${model.device}
    clip_emb_k: 5
    pool: mean
    max_memory_fraction: 0.5
    encoder_batch_size: null
    min_batch_size: 32
