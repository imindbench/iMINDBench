name: laplacian_wav_long_context_15s_diverstyle
chain:
  - name: context_window
    context_window_sec: 15.0
    sampling_rate: 2048

  - name: time_domain_filter_diver_style
    sampling_rate: 2048
    notch_freqs: [60, 120, 180]

  - name: crop_to_target_window

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: downsample
    source_rate: 2048
    target_rate: 500