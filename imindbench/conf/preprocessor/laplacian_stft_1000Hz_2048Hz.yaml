# 1000 Hz input upsampled to a 2048 Hz Laplacian STFT chain.
name: laplacian_stft_1000Hz_2048Hz
chain:
  - name: time_domain_filter
    sampling_rate: 1000
    high_gamma: false
    notch_q: 30

  - name: upsampler
    source_rate: 1000
    target_rate: 2048

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: stft
    nperseg: 512
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 2048
    normalizing: none

  - name: standardize
    mode: per_channel_samples_time_pooled
