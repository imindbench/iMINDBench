# 1000 Hz Laplacian with Notch Filter + Standardization
name: laplacian_wav
chain:
  - name: time_domain_filter
    sampling_rate: 1000
    high_gamma: false
    notch_q: 30
    high_pass_hz: 0.5
    high_pass_order: 4
    high_pass_zero_phase: true

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: standardize
    mode: global_robust_scalar
