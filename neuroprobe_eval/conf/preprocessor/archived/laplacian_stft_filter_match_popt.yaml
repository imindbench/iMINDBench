# Laplacian STFT followed by optional channel selection and standardization.
name: laplacian_stft
chain:
  # Time-domain filtering to match PopT-BYD-BTB (notch + optional bandpass).
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30
    bandpass_q: 5
    bandpass_low: 70
    bandpass_high: 250
    
  - name: laplacian_rereference
    remove_non_laplacian: true
    
  - name: channel_subselect
    # Either provide a list of labels or a JSON file containing a list
    # allowed_electrodes: ["T1b1", "T1b2"]
    # allowed_electrodes: /path/to/clean_laplacian.json
    allowed_electrodes: null
    subject: null
    
  - name: stft
    use_scipy: false
    nperseg: 400
    poverlap: 0.875
    sampling_rate: 2048
    max_frequency: 250
    min_frequency: 0
    clip_k: 1
    freq_channel_cutoff: 40
    normalizing: none
    boundary: zeros
    padded: true
    pad_mode: constant
    torch_dtype: float64

  - name: standardize
    mode: per_channel_feature  # Default mode (variable-channel)
    # Options: per_channel_feature (default) | per_channel_samples_time_pooled
