# Neuroprobe2025 DS-DM release preprocessor chain.
# Includes mandatory region-intersection pooling.
name: laplacian_stft_region_pool
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30
    bandpass_q: 5
    bandpass_low: 70
    bandpass_high: 250

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: channel_subselect
    allowed_electrodes: null
    subject: null

  - name: stft
    nperseg: 512
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 2048
    normalizing: none

  - name: region_intersection_pool
    # Brain-area source key is configured at dataset.brain_area_key.

  - name: standardize
    mode: per_channel_feature
