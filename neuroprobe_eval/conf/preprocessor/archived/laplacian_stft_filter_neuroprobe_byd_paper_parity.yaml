# Laplacian STFT for BYD (1000 Hz) with PopT-compatible filtering and rand20 routing.
name: laplacian_stft
chain:
  - name: time_domain_filter
    sampling_rate: 1000
    high_gamma: false
    notch_q: 30
    notch_zero_phase: true
    high_pass_hz: 0.1
    high_pass_order: 4
    high_pass_zero_phase: true
    bandpass_q: 5
    bandpass_low: 70
    bandpass_high: 250

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: channel_subselect
    allowed_electrodes: null
    subject: null

  - name: stft
    nperseg: 250
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 1000
    normalizing: none

  - name: standardize
    mode: per_channel_feature
