# Laplacian STFT chain with per-channel pooled standardization
name: laplacian_stft_samples_time
chain:
  - name: laplacian_rereference
    remove_non_laplacian: false
  - name: channel_subselect
    allowed_electrodes: null
    subject: null
  - name: stft
    nperseg: 512
    poverlap: 0.75
    window: hann
    max_frequency: 150
    min_frequency: 0
    sampling_rate: 2048
    normalizing: none
  - name: standardize
    mode: per_channel_samples_time_pooled  # Standardize across per-channel samples*time dimension
