# PIPPI high-cov: PopT STFT chain at native 2048 Hz.
name: popt_stft
chain:
  - name: time_domain_filter
    sampling_rate: 2048
    high_gamma: false
    notch_q: 30
    bandpass_q: 5
    bandpass_low: 70
    bandpass_high: 250

  - name: laplacian_rereference
    remove_non_laplacian: true

  - name: channel_subselect
    allowed_electrodes: null
    subject: null

  - name: stft
    use_scipy: false
    nperseg: 512
    poverlap: 0.75
    sampling_rate: 2048
    max_frequency: 150
    min_frequency: 0
    clip_k: 0
    freq_channel_cutoff: 40
    normalizing: none
    boundary: zeros
    padded: true
    pad_mode: constant
    torch_dtype: float64

  - name: region_intersection_pool

  - name: standardize
    mode: per_channel_samples_time_pooled
