name: brant
requires_aligned_channels: false
requires_coords: false

# BaRISTA-style adaptation:
# resample each whole short window to one 1500-sample BRANT pseudo-patch.
upstream_ckpt_dir: ${paths.brant_checkpoint_dir}
random_init: false
frozen_upstream: false

# Best-performance default for the current short-window BRANT path:
# keep the conservative backbone LR that worked best in saved runs, but use
# AdamW + weight decay and a longer training ceiling with real early stopping.
upstream_lr: 1e-7
head_lr: 1e-3
head_type: mlp_token  # linear_pooled | mlp_pooled | mlp_token
head_hidden_dims: [1024, 512]
# Inactive for BRANT because get_parameter_groups() sets explicit per-group LRs.
learning_rate: null
optimizer: AdamW
weight_decay: 0.01
grad_clip: 1.0
scheduler:
  name: ramp_up
  warmup_steps: 50
  num_decays: 20
  gamma: 0.95

training_mode: epoch_based
# Inactive for epoch_based training; only needed if this config is switched to
# steps_based.
total_steps: null
validation_interval: null
selection_metric: roc_auc
selection_warmup_epochs: 2
max_iter: 75
patience: 25
tol: 1e-4
batch_size: 64
random_state: 42
device: auto

seg_len: 1500
seq_len: 1
d_model: 2048
dim_feedforward: 3072
time_ar_layer: 12
time_ar_head: 16
ch_ar_layer: 5
ch_ar_head: 16
band_num: 8
band_edges: [4, 8, 13, 30, 50, 70, 90, 110, 128]
project_mode: linear
learnable_mask: false
dropout: 0.1
power_sampling_rate: 1500
cache_inputs: true
